<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trustline</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#16171a" />
        <circle cx="10" cy="16" r="3.2" fill="#fff" />
        <circle cx="22" cy="16" r="3.2" fill="#8d97ee" />
        <path d="M13.2 16h5.6" stroke="#fff" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>Trustline</span>
    </header>
    <main>
      <section id="you" class="card">
        <p class="eyebrow">Your Trustline</p>
        <p id="you-status" class="muted">Checking…</p>
      </section>
      <section class="card">
        <p class="eyebrow">This page</p>
        <p id="page-status" class="muted">Trustline runs on supported marketplace pages.</p>
      </section>
      <a id="open" class="btn" href="http://localhost:3000/dashboard" target="_blank" rel="noopener">Open Trustline</a>
      <p class="foot">Prototype · works with the CityStay demo marketplace</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
